const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); cv.style.width = W+'px'; cv.style.height = H+'px'; }
addEventListener('resize', resize); resize();
const FONT = '"Kanit","Prompt","Noto Sans Thai","Leelawadee UI","Thonburi",Tahoma,sans-serif';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const TAU = Math.PI*2;
function shade(hex, amt){ const c=parseInt(hex.slice(1),16); let r=c>>16, g=c>>8&255, b=c&255;
  if(amt<0){ r*=1+amt; g*=1+amt; b*=1+amt; } else { r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  return `rgb(${r|0},${g|0},${b|0})`; }
const F = (s,w=600)=>`${w} ${s}px ${FONT}`;
function rr(x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function box(c,x,y,w,h){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h); }
function poly(c,p){ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.closePath(); ctx.fill(); ctx.stroke(); }
function circle(c,x,y,r){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function txt(s,x,y,size,color='#fff',align='center',w=600,stroke=null,sw=4){ ctx.font=F(size,w); ctx.textAlign=align; ctx.textBaseline='middle';
  if(stroke){ ctx.lineWidth=sw; ctx.strokeStyle=stroke; ctx.lineJoin='round'; ctx.strokeText(s,x,y); } ctx.fillStyle=color; ctx.fillText(s,x,y); }
function fitTxt(s,x,y,size,maxW,color,align,w,stroke,sw){ ctx.font=F(size,w); while(ctx.measureText(s).width>maxW && size>10){ size--; ctx.font=F(size,w); } txt(s,x,y,size,color,align,w,stroke,sw); }
function emoji(e,x,y,size){ ctx.font=`${size}px ${EMOJI_FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(e,x,y); }

/* ตัดบรรทัดภาษาไทยด้วย Intl.Segmenter (ถ้ามี) */
const SEG = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter('th',{granularity:'word'}) : null;
function clusters(s){ const out=[]; for(const ch of s){ const last=out[out.length-1];
  if(last!==undefined && (/[ัิ-ฺ็-๎]/.test(ch) || /[เ-ไ]$/.test(last))) out[out.length-1]+=ch; else out.push(ch); } return out; }
const wrapCache = new Map();
function wrap(s,maxW,size,w=400){ const key=s+'|'+maxW+'|'+size+'|'+w; const hit=wrapCache.get(key); if(hit) return hit;
  ctx.font=F(size,w); const out=[];
  for(const para of s.split('\n')){ const toks = SEG ? [...SEG.segment(para)].map(x=>x.segment) : clusters(para); let line='';
    for(const tk of toks){ const test=line+tk;
      if(ctx.measureText(test).width<=maxW){ line=test; continue; }
      if(line===''){ let part=''; for(const ch of clusters(tk)){ if(part && ctx.measureText(part+ch).width>maxW){ out.push(part); part=ch; } else part+=ch; } line=part; }
      else { out.push(line.trimEnd()); line=tk.trimStart(); } }
    out.push(line); }
  if(wrapCache.size>600) wrapCache.clear(); wrapCache.set(key,out); return out; }

/* ============================ เสียง ============================ */
const mtof = n => 440*Math.pow(2,(n-69)/12);
const A = {
  ctx:null, muted:false,
  init(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c = this.ctx = new AC();
    this.master=c.createGain(); this.master.gain.value=this.muted?0:0.8; this.master.connect(c.destination);
    this.mus=c.createGain(); this.mus.gain.value=0.5; this.mus.connect(this.master);
    this.fx=c.createGain(); this.fx.gain.value=0.9; this.fx.connect(this.master);
    const len=c.sampleRate*0.5, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.nbuf=b;
    music.next = c.currentTime+0.1; },
  setMute(m){ this.muted=m; if(this.ctx) this.master.gain.setTargetAtTime(m?0:0.8,this.ctx.currentTime,0.02); },
  tone(f,t,d,type='square',v=.1,dest,slide){ const c=this.ctx; if(!c) return; const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||this.fx); o.start(t); o.stop(t+d+0.05); },
  noise(t,d,v=.1,dest,hp=0){ const c=this.ctx; if(!c) return; const s=c.createBufferSource(); s.buffer=this.nbuf; const g=c.createGain();
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); let node=s;
    if(hp){ const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; s.connect(f); node=f; }
    node.connect(g); g.connect(dest||this.fx); s.start(t); s.stop(t+d+0.02); },
  sfx(n){ if(!this.ctx) return; const t=this.ctx.currentTime, T=(f,dt,d,ty,v,sl)=>this.tone(f,t+dt,d,ty,v,this.fx,sl);
    switch(n){
      case 'coin': T(988,0,.07,'square',.11); T(1319,.06,.16,'square',.11); break;
      case 'jump': T(330,0,.16,'square',.09,880); break;
      case 'ok': T(660,0,.09,'triangle',.25); T(990,.08,.18,'triangle',.25); break;
      case 'crystal': [784,988,1175,1568,1976].forEach((f,i)=>T(f,i*.07,.3,'triangle',.22)); T(2637,.38,.5,'sine',.12); break;
      case 'wrong': T(220,0,.28,'sawtooth',.11,110); break;
      case 'click': T(1400,0,.04,'square',.05); break;
      case 'giggle': for(let i=0;i<6;i++) T(i%2?760:980,i*.07,.06,'square',.08,i%2?700:900); break;
      case 'hit': this.noise(t,.18,.3); T(180,0,.25,'sine',.35,50); break;
      case 'zap': T(1800,0,.5,'sawtooth',.07,200); T(900,0,.5,'square',.05,150); break;
      case 'win': [523,659,784,1047].forEach((f,i)=>T(f,i*.11,i===3?.5:.14,'square',.11)); break;
      case 'lose': [392,330,262].forEach((f,i)=>T(f,i*.16,.2,'triangle',.25)); break;
      case 'blip': T(600+Math.random()*200,0,.035,'square',.03); break;
      case 'blipBug': T(250+Math.random()*120,0,.04,'square',.04); break;
      case 'toast': T(880,0,.08,'sine',.15); T(1320,.07,.12,'sine',.15); break;
      case 'start': [523,784,1047].forEach((f,i)=>T(f,i*.08,.18,'square',.1)); break;
    } }
};

function walkable(x,y){

  if(!ok) for(const i of ISL) if(x>i.x+20&&x<i.x+i.w-20&&y>i.y+20&&y<i.y+i.h-20){ ok=true; break; }
  if(!ok) return false;
  for(const o of OBST){ if(o.r){ const ex=x-o.x, ey=y-o.y; if(ex*ex+ey*ey<(o.r+10)*(o.r+10)) return false; }
    else if(x>o.x-8&&x<o.x+o.w+8&&y>o.y-6&&y<o.y+o.h+6) return false; }

}

  init(m){ m.goal=100; m.time=50; m.cam=0; m.sp=240; m.coinsGot=0;
    const bars=[{x:-200,w:700,h:140,c:'#4dabf7'}]; let x=500, h=140;
    while(x<4200){ const gap=rand(55,110), w=rand(120,220); h=clamp(h+rand(-80,65),90,250); x+=gap; bars.push({x,w,h,c:pick(this.cols)}); x+=w; }
    x+=80; bars.push({x,w:900,h:140,c:'#69db7c'}); m.finish=x+120; m.bars=bars; m.coins=[];
    for(let i=2;i<bars.length-1;i++) if(Math.random()<0.6){ const b=bars[i]; m.coins.push({x:b.x+b.w/2,y:500-b.h-58,got:false}); }
    m.p={x:180,y:360,vy:0,j:0,g:true,ph:0}; },
  jump(m){ const p=m.p; if(p.g||p.j<2){ p.vy=-650; p.j=p.g?1:p.j+1; p.g=false; A.sfx('jump'); } },
  respawn(m){ const p=m.p; let tx=m.cam+180;
    let b=m.bars.find(b=>tx>=b.x+10&&tx<=b.x+b.w-10)||m.bars.find(b=>b.x>tx)||m.bars[m.bars.length-1];
    if(tx<b.x+10) tx=b.x+24; m.cam=tx-180; p.x=tx; p.y=500-b.h; p.vy=0; p.g=true; p.j=0;
    m.time-=2; A.sfx('wrong'); flash(m,'ตกกราฟ! เวลา -2 วินาที','#ff4d6d'); },
  update(m,dt){ const p=m.p; m.cam+=m.sp*dt; const lag=(m.cam+180)-p.x, vx=m.sp+clamp(lag*3,0,m.sp*0.6);
    let nx=p.x+vx*dt; p.vy+=1900*dt; let ny=p.y+p.vy*dt; p.g=false;
    for(const b of m.bars){ const top=500-b.h;
      if(p.x+11<=b.x && nx+11>b.x && p.y>top+3) nx=b.x-11;
      if(nx+10>b.x && nx-10<b.x+b.w && p.y<=top+0.5 && ny>=top && p.vy>=0){ ny=top; p.vy=0; p.g=true; p.j=0; } }
    p.x=nx; p.y=ny; p.ph+=dt*14;
    for(const c of m.coins) if(!c.got && Math.abs(p.x-c.x)<26 && Math.abs(p.y-30-c.y)<38){ c.got=true; m.coinsGot++; A.sfx('coin'); textPop(m.parts,c.x-m.cam,c.y,'+💰','#f59f00'); }
    if(p.y>560 || p.x-m.cam<-30) this.respawn(m);
    m.score=p.x>=m.finish?100:Math.floor(clamp(p.x/m.finish,0,0.99)*100); },
  tap(m){ this.jump(m); },
  key(m,c){ if(c==='Space'||c==='ArrowUp'||c==='KeyW') this.jump(m); },
  score(m){ return '📈 '+m.score+'% • 💰'+m.coinsGot; },
  draw(m){
    ctx.fillStyle='#f8f9fa'; ctx.fillRect(0,56,800,444);
    ctx.strokeStyle='#e9ecef'; ctx.lineWidth=1; const off=(m.cam*0.5)%40;
    for(let x=-off;x<800;x+=40){ ctx.beginPath(); ctx.moveTo(x,56); ctx.lineTo(x,500); ctx.stroke(); }
    for(let y=60;y<500;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(800,y); ctx.stroke(); }
    ctx.save(); ctx.beginPath(); ctx.rect(0,56,800,444); ctx.clip(); ctx.translate(-m.cam,0);
    const vis=m.bars.filter(b=>b.x+b.w>m.cam-20&&b.x<m.cam+820);
    ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
    for(const b of vis){ ctx.fillStyle=b.c; rr(b.x,500-b.h,b.w,b.h+10,8); ctx.fill(); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(b.x+8,500-b.h+8,12,b.h-8); }
    ctx.strokeStyle='#f03e3e'; ctx.lineWidth=3; ctx.beginPath(); vis.forEach((b,i)=>{ const X=b.x+b.w/2, Y=500-b.h-14; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke();
    for(const b of vis) circle('#f03e3e',b.x+b.w/2,500-b.h-14,5);
    for(const c of m.coins) if(!c.got && c.x>m.cam-30 && c.x<m.cam+830) emoji('💰',c.x,c.y+Math.sin(G.t*4+c.x)*4,30);
    const fx=m.finish; ctx.fillStyle='#495057'; ctx.fillRect(fx-3,260,6,100);
    for(let r=0;r<3;r++) for(let c=0;c<5;c++){ ctx.fillStyle=(r+c)%2?'#212529':'#fff'; ctx.fillRect(fx+3+c*12,262+r*12,12,12); }
    txt('เส้นชัย',fx+33,240,18,'#2b8a3e','center',800,'#fff',4);
    drawAvatar(m.p.x,m.p.y,1.1,G.look,{dir:'right',phase:m.p.ph,moving:m.p.g});
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,.08)'; rr(140,470,520,14,7); ctx.fill(); ctx.fillStyle='#3a7bff'; rr(140,470,520*m.score/100,14,7); ctx.fill();
  }
};

  txt('ภารกิจตามหา 6 คริสตัลแห่งอนาคต',400,160,28,'#fff3bf','center',700,'#5f3dc4',8);
  fitTxt(CONFIG.faculty,400,202,19,740,'#fff','center',600,'rgba(0,0,0,.35)',4);
  fitTxt(CONFIG.uni,400,228,16,740,'#fff','center',500,'rgba(0,0,0,.35)',4);
  PROGS.forEach((p,i)=>drawCrystal(150+i*100,276+Math.sin(G.t*2+i)*8,13,p.color,G.t));
  drawBit(265,420,1.4,G.t); drawAvatar(345,425,1.8,G.look,{dir:'down',phase:G.t*8,moving:true}); drawBug(520,422,1.6,G.t);
  emoji('🏯',640,400,40); emoji('🌾',160,412,34);
  if(Math.sin(G.t*4)>-0.3) txt(G.touchUI?'แตะหน้าจอเพื่อเริ่ม':'คลิก หรือกด Enter เพื่อเริ่ม',400,478,22,'#fff','center',700,'#364fc7',6);
  endStage();
  muteButton(W-54,10); txt('🔊 เกมนี้มีเสียงประกอบ',12,H-16,13,'rgba(255,255,255,.85)','left',500);
}
function drawCustom(){
  skyBg(); beginStage(); floatBlocks();
  txt('สร้างตัวละครของคุณ',400,36,32,'#fff','center',800,'#5f3dc4',8);

  row(96,'สีเสื้อ',SHIRTS,'shirt'); row(154,'สีกางเกง',PANTS,'pants'); row(212,'สีผม',HAIRS,'hair'); row(270,'สีผิว',SKINS,'skin');

  button(370,410,150,58,'🎲 สุ่ม',()=>{ G.look=randLook(); },{c:'#e7f5ff',fs:20,k:'R'});
  button(540,410,230,58,'เริ่มผจญภัย ▶',()=>startAdventure(),{c:'#51cf66',tc:'#fff',fs:22,k:'Enter'});
  endStage(); muteButton(W-54,10);
}
function tryFullscreen(){ try{ const el=document.documentElement; const fn=el.requestFullscreen||el.webkitRequestFullscreen; if(!fn) return;
  const r=fn.call(el); const lock=()=>{ try{ if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} };
  if(r&&r.then) r.then(lock).catch(()=>{}); else lock(); }catch(e){} }
function goCustom(){ G.state='custom'; A.sfx('start'); }
function startAdventure(){ G.state='world'; G.startTime=G.t; G.area='plaza'; music.play('lobby'); A.sfx('start'); G.bugVisible=true;
  say([{who:'bit',text:'สวัสดี! ยินดีต้อนรับสู่'+CONFIG.faculty+' '+CONFIG.uni+' ฉันชื่อ "น้องบิท" ไกด์ประจำคณะเอง'},
       {who:'bug',text:'กิ๊ก ๆ ๆ! ข้าคือบั๊กป่วน! คริสตัลแห่งทักษะทั้ง 6 ดวง ข้าเอาไปซ่อนไว้ทั่วทั้ง 4 ศูนย์พื้นที่แล้ว หาให้เจอสิ!'},
       {who:'bit',text:'แย่แล้ว! ช่วยกันตามหาหน่อยนะ ข้ามสะพานไปยังศูนย์ทั้ง 4 แห่ง แล้วคุยกับพี่ ๆ ที่มีเครื่องหมาย ! สีเหลืองบนหัว'},
       {who:'bit',text:G.touchUI?'วิธีเล่น: ลากนิ้วที่ครึ่งซ้ายของจอเพื่อเดิน และแตะครึ่งขวาของจอ (ปุ่ม A) เพื่อคุย':'วิธีเล่น: ใช้ปุ่มลูกศร หรือ W A S D เพื่อเดิน และกด E หรือ Space เพื่อคุย'}],
    ()=>{ G.bugVisible=false; burst(G.parts,1300,1225,'#9b59b6',30,260); A.sfx('giggle'); toast('ตามหาคริสตัลทั้ง 6 ดวงใน 4 ศูนย์พื้นที่!'); }); }
function resetGame(){ G.crystals.clear(); G.done.clear(); G.p={x:1300,y:1400,dir:'down',ph:0,moving:false}; G.bit={x:1260,y:1400};
  G.area='plaza'; G.boss=null; G.mg=null; G.card=null; G.dialog=null; G.parts=[]; G.eparts=[]; G.bugVisible=false; G.state='title'; music.play('lobby'); }

/* ============================ โลก: อัปเดต / วาด ============================ */
function worldMusic(){ const i=islandAt(G.p.x,G.p.y); music.play(i?i.track:'lobby'); }
function interact(n){ if(G.dialog) return;
  if(n.kind==='prof'){ const c=campus(n.campus), nm='อาจารย์ประจำ'+c.name, list=PROGS.filter(p=>p.campus===n.campus).map(p=>p.short).join(' และ ');
    say([{who:'prof',name:nm,look:n.look,text:c.intro},{who:'prof',name:nm,look:n.look,text:'คริสตัลของสาขา'+list+' ถูกซ่อนไว้ที่ศูนย์นี้ ไปช่วยพี่ ๆ ตามหากันเลย!'}]); }
  else if(n.kind==='prog'){ const p=prog(n.prog), nm=p.npc+' • '+p.short;
    if(!G.done.has(p.id)) say([{who:'npc',name:nm,look:n.look,text:p.greet}],()=>startMG(p));
    else say([{who:'npc',name:nm,look:n.look,text:'ขอบคุณมากนะน้อง! '+p.crystal+'กลับมาแล้ว ไปช่วยพี่ ๆ สาขาอื่นต่อได้เลย'}],()=>openCard(p,false)); }
  else if(n.kind==='pedestal'){
    if(G.crystals.size<6) say([{who:'bit',text:'แท่นคริสตัลยังว่างอยู่ '+(6-G.crystals.size)+' ช่อง ตามหาให้ครบก่อนนะ! ดูแผนที่มุมขวาบน จุดสีเหลืองคือด่านที่ยังไม่ผ่าน'}]);
    else say([{who:'bug',text:'กิ๊ก ๆ! คิดว่ารวบรวมคริสตัลครบแล้วจะชนะข้าได้งั้นเหรอ?'},
              {who:'bit',text:'ใช้ความรู้จากทั้ง 6 สาขาตอบคำถามให้ถูก เพื่อยิงพลังคริสตัลใส่บั๊กป่วนกันเถอะ!'}],()=>startBoss()); } }
function nearLabel(n){ if(n.kind==='prog'){ const p=prog(n.prog); return 'คุยกับ'+p.npc+' ('+p.short+')'; }
  if(n.kind==='prof') return 'คุยกับอาจารย์ประจำศูนย์'; return G.crystals.size===6?'ท้าสู้บั๊กป่วน!':'ตรวจดูแท่นคริสตัล'; }
function updateWorld(dt){
  const p=G.p; let ix=0, iy=0;
  if(!G.dialog){
    if(keys.ArrowLeft||keys.KeyA) ix-=1; if(keys.ArrowRight||keys.KeyD) ix+=1; if(keys.ArrowUp||keys.KeyW) iy-=1; if(keys.ArrowDown||keys.KeyS) iy+=1;
    if(G.joy){ const dx=G.joy.x-G.joy.ox, dy=G.joy.y-G.joy.oy, d=Math.hypot(dx,dy); if(d>8){ const k=Math.min(d,55)/55; ix+=dx/d*k; iy+=dy/d*k; } } }
  const mag=Math.hypot(ix,iy); if(mag>1){ ix/=mag; iy/=mag; }
  p.moving=mag>0.1;
  if(p.moving){ const sp=270, nx=p.x+ix*sp*dt, ny=p.y+iy*sp*dt; if(walkable(nx,p.y)) p.x=nx; if(walkable(p.x,ny)) p.y=ny; p.ph+=dt*11;
    if(Math.abs(ix)>Math.abs(iy)) p.dir=ix<0?'left':'right'; else p.dir=iy<0?'up':'down'; }
  G.bit.x=lerp(G.bit.x,p.x-38,Math.min(1,dt*4)); G.bit.y=lerp(G.bit.y,p.y+6,Math.min(1,dt*4));
  const isl=islandAt(p.x,p.y), area=isl?isl.id:'plaza';
  if(area!==G.area){ G.area=area; if(isl) toast('ยินดีต้อนรับสู่ '+campus(area).name); music.play(isl?isl.track:'lobby'); }
  G.near=null; let best=82; for(const n of interactables()){ const d=Math.hypot(n.x-p.x,n.y-p.y); if(d<best){ best=d; G.near=n; } }
  updParts(G.parts,dt);
}
function drawWorld(){
  const z=clamp(Math.min(W,H)/640,0.55,1.15); G.z=z; const cx=G.p.x, cy=G.p.y-30;
  ctx.fillStyle='#3fa9f5'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-cx,-cy);
  const vx0=cx-W/2/z-60, vx1=cx+W/2/z+60, vy0=cy-H/2/z-60, vy1=cy+H/2/z+60;
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3;
  for(let y=Math.floor(vy0/70)*70;y<vy1;y+=70){ const odd=Math.abs(Math.round(y/70))%2;
    for(let x=Math.floor(vx0/120)*120+odd*60;x<vx1;x+=120){ const o=Math.sin(G.t*1.5+x*0.01+y*0.02)*8; ctx.beginPath(); ctx.moveTo(x+o,y); ctx.quadraticCurveTo(x+o+15,y-8,x+o+30,y); ctx.stroke(); } }
  ISL.forEach(drawIsland); BRIDGES.forEach(drawBridge); drawPlaza();
  const ents=[];
  for(const d of DECOS){ if(d.x<vx0-200||d.x>vx1+200||d.y<vy0-40||d.y>vy1+260) continue; if(d.t==='pond') { drawDeco(d); continue; } ents.push({y:d.y,f:()=>drawDeco(d)}); }
  for(const n of NPCS) ents.push({y:n.y,f:()=>drawNPC(n)});
  ents.push({y:1300,f:dPedestal});
  if(G.bugVisible) ents.push({y:1262,f:()=>drawBug(1300,1250,G.crystals.size===6?2.2:1.4,G.t)});
  ents.push({y:G.p.y,f:()=>drawAvatar(G.p.x,G.p.y,1,G.look,{dir:G.p.dir,phase:G.p.ph,moving:G.p.moving})});
  ents.push({y:G.bit.y-1,f:()=>drawBit(G.bit.x,G.bit.y,1,G.t)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  drawParts(G.parts);
  ctx.restore();
  drawHUD();
}
function drawHUD(){
  const s=H<480?0.8:1;
  ctx.fillStyle='rgba(18,22,58,.78)'; rr(10,10,(6*34+70)*s,50*s,14); ctx.fill();
  PROGS.forEach((p,i)=>{ const x=10+(24+i*34)*s, y=10+25*s; if(G.crystals.has(p.id)) drawCrystal(x,y,12*s,p.color,G.t); else crystalSlot(x,y,11*s); });
  txt(G.crystals.size+'/6',10+(6*34+40)*s,10+25*s,17*s,'#ffd43b','center',800);
  muteButton(W-54,10);
  const ms=H<480?92:124, mx=W-ms-10, my=62, k=ms/2600;
  ctx.fillStyle='rgba(20,60,130,.78)'; rr(mx,my,ms,ms,12); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.stroke();
  ISL.forEach(i=>{ ctx.fillStyle=i.grass; rr(mx+i.x*k,my+i.y*k,i.w*k,i.h*k,4); ctx.fill(); });
  ctx.fillStyle='#c98b4b'; BRIDGES.forEach(b=>ctx.fillRect(mx+b.x*k,my+b.y*k,b.w*k,b.h*k));
  circle('#fff1c1',mx+1300*k,my+1300*k,260*k);
  NPCS.forEach(n=>{ if(n.kind!=='prog') return; circle(G.done.has(n.prog)?'#adb5bd':'#ffd43b',mx+n.x*k,my+n.y*k,3.5); });
  if(G.crystals.size===6 && Math.sin(G.t*6)>0) circle('#ff4d6d',mx+1300*k,my+1300*k,5);
  circle('#fff',mx+G.p.x*k,my+G.p.y*k,4.5); ctx.strokeStyle='#212529'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(mx+G.p.x*k,my+G.p.y*k,4.5,0,TAU); ctx.stroke();
  if(G.near && !G.dialog){ const label=(G.touchUI?'แตะปุ่ม A':'กด E')+' • '+nearLabel(G.near); ctx.font=F(16,700);
    const tw=ctx.measureText(label).width+32, by=(G.touchUI&&W<600)?H-200:H-64; ctx.fillStyle='rgba(18,22,58,.88)'; rr(W/2-tw/2,by,tw,40,20); ctx.fill();
    ctx.strokeStyle='#ffd43b'; ctx.lineWidth=2; ctx.stroke(); txt(label,W/2,by+20,16,'#fff','center',700); }
  if(G.touchUI && !G.dialog){
    const j=G.joy, jx=j?j.ox:92, jy=j?j.oy:H-92; ctx.globalAlpha=j?0.85:0.45;
    circle('rgba(255,255,255,.25)',jx,jy,56); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(jx,jy,56,0,TAU); ctx.stroke();
    let kx=jx, ky=jy; if(j){ const dx=j.x-j.ox, dy=j.y-j.oy, d=Math.hypot(dx,dy), m=Math.min(d,55); if(d>0){ kx=jx+dx/d*m; ky=jy+dy/d*m; } }
    circle('#fff',kx,ky,24); ctx.globalAlpha=1; if(!j) txt('ลากเพื่อเดิน',92,H-160,13,'#fff','center',600,'rgba(0,0,0,.4)',3);
    const ax=W-84, ay=H-84; circle(G.near?'#ffd43b':'rgba(255,255,255,.35)',ax,ay,44); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ax,ay,44,0,TAU); ctx.stroke();
    txt('A',ax,ay-4,30,G.near?'#5f3dc4':'#fff','center',800); txt('คุย',ax,ay+22,13,G.near?'#5f3dc4':'#fff','center',700); }
  if(G.toast){ ctx.globalAlpha=clamp(G.toast.t*2,0,1); ctx.font=F(17,700); const tw=ctx.measureText(G.toast.text).width+36, ty=10+60*s;
    ctx.fillStyle='rgba(255,212,59,.96)'; rr(W/2-tw/2,ty,tw,40,20); ctx.fill(); txt(G.toast.text,W/2,ty+20,17,'#3b2a00','center',700); ctx.globalAlpha=1; }
}

/* ============================ หน้าแนะนำให้หมุนจอ ============================ */
function portraitBlock(){ return G.touchUI && H>W && !G.portraitOK && ['custom','minigame','boss','card'].includes(G.state); }
function drawPortrait(){ skyBg(); ctx.save(); ctx.translate(W/2,H*0.36); ctx.rotate(Math.sin(G.t*2)>0?-Math.PI/2:0); emoji('📱',0,0,90); ctx.restore();
  txt('หมุนโทรศัพท์เป็นแนวนอน',W/2,H*0.52,24,'#fff','center',800,'#5f3dc4',6);
  txt('เพื่อการเล่นที่สนุกและง่ายขึ้น',W/2,H*0.52+36,17,'#fff','center',600);
  button(W/2-110,H*0.68,220,52,'เล่นแนวตั้งต่อ',()=>{ G.portraitOK=true; },{c:'#ffd43b',fs:18}); }

/* ============================ อินพุต ============================ */
const keys={};
function onKey(c){
  if(c==='KeyM'){ A.setMute(!A.muted); return; }
  if(G.dialog){ if(c==='Space'||c==='Enter'||c==='KeyE'||c==='NumpadEnter') advanceDialog(); return; }
  const go=(c==='Enter'||c==='NumpadEnter'||c==='Space');
  switch(G.state){
    case 'title': if(go) goCustom(); break;
    case 'custom': if(c==='Enter'||c==='NumpadEnter') startAdventure(); else if(c==='KeyR') G.look=randLook(); break;
    case 'world': if((c==='KeyE'||c==='Space'||c==='Enter') && G.near) interact(G.near); break;
    case 'minigame': { const m=G.mg; if(!m) break;
      if(c==='Escape'){ exitMG(); break; }
      if(m.phase==='intro' && go){ m.phase='play'; A.sfx('start'); }
      else if(m.phase==='result' && (c==='Enter'||c==='NumpadEnter')){ if(m.win) winMG(); else startMG(m.prog,true); }
      else if(m.phase==='play' && m.def.key) m.def.key(m,c); break; }
    case 'card': if(go) closeCard(); break;
    case 'boss': { const mm=/^(Digit|Numpad)([1-3])$/.exec(c); if(mm) bossAnswer(+mm[2]-1); break; }
    case 'ending': if(c==='KeyR') resetGame(); break;
  }
}
addEventListener('keydown',e=>{ A.init();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyE'].includes(e.code)) G.touchUI=false;
  keys[e.code]=true; if(!e.repeat) onKey(e.code); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; G.joy=null; });
function hitBtn(b,x,y){ return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h; }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); A.init(); if(e.pointerType==='touch') G.touchUI=true; const x=e.clientX, y=e.clientY;
  for(let i=buttons.length-1;i>=0;i--){ const b=buttons[i]; if(b.pri && hitBtn(b,x,y)){ A.sfx('click'); b.cb(); return; } }
  if(G.dialog){ advanceDialog(); return; }
  for(let i=buttons.length-1;i>=0;i--){ const b=buttons[i]; if(!b.pri && hitBtn(b,x,y)){ A.sfx('click'); b.cb(); return; } }
  if(portraitBlock()) return;
  switch(G.state){
    case 'title': if(e.pointerType==='touch') tryFullscreen(); goCustom(); break;
    case 'world': if(x<W*0.5) G.joy={id:e.pointerId,ox:x,oy:y,x,y}; else if(G.near) interact(G.near); break;
    case 'minigame': { const m=G.mg; if(m && m.phase==='play'){ const v=toV(x,y); m.hold={id:e.pointerId,x:v.x,y:v.y}; if(m.def.tap) m.def.tap(m,v.x,v.y); } break; }
  }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
},{passive:false});
cv.addEventListener('pointermove',e=>{ if(G.joy&&G.joy.id===e.pointerId){ G.joy.x=e.clientX; G.joy.y=e.clientY; }
  const m=G.mg; if(m&&m.hold&&m.hold.id===e.pointerId){ const v=toV(e.clientX,e.clientY); m.hold.x=v.x; m.hold.y=v.y; } });
function ptrUp(e){ if(G.joy&&G.joy.id===e.pointerId) G.joy=null; const m=G.mg; if(m&&m.hold&&m.hold.id===e.pointerId) m.hold=null; }
cv.addEventListener('pointerup',ptrUp); cv.addEventListener('pointercancel',ptrUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{ if(!A.ctx) return; if(document.hidden) A.ctx.suspend(); else A.ctx.resume(); });

/* ============================ ลูปหลัก ============================ */
function update(dt){ if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; } updDialog(dt);
  switch(G.state){ case 'world': updateWorld(dt); break; case 'minigame': if(!portraitBlock()) updateMG(dt); break;
    case 'boss': updateBoss(dt); break; case 'ending': updateEnding(dt); break; case 'card': updParts(G.eparts,dt); break; } }
function draw(){ ctx.setTransform(DPR,0,0,DPR,0,0); buttons.length=0; computeStage();
  if(portraitBlock()){ drawPortrait(); return; }
  switch(G.state){ case 'title': drawTitle(); break; case 'custom': drawCustom(); break; case 'world': drawWorld(); break;
    case 'minigame': drawMG(); break; case 'card': drawCard(); break; case 'boss': drawBoss(); break; case 'ending': drawEnding(); break; }
  if(G.dialog) drawDialog(); }
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; G.t+=dt; update(dt); draw(); requestAnimationFrame(frame); }
music.play('lobby');
requestAnimationFrame(frame);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>wrapCache.clear());
</script>
